# PAL TIAGo Pro, both arms (`make tiago_pro`). See franka.yaml for the keys.
description: TIAGo Pro, dual arm
rviz: true
linear_scale: 1.0
use_origin_lighthouse: false
arms:
  left:
    output_topic: /vive/left/output_pose
    reference_frame: opensot/base_link
    target_frame: opensot/gripper_left_grasping_link
    publish_frequency: 30.0
    rotation_offset: [180.0, 0.0, 0.0]
    buttons:
      menu: /vive/left/gripper
  right:
    output_topic: /vive/right/output_pose
    reference_frame: opensot/base_link
    target_frame: opensot/gripper_right_grasping_link
    publish_frequency: 30.0
    rotation_offset: [180.0, 0.0, 0.0]
    buttons:
      menu: /vive/right/gripper
