# Defaults for the Vive controller drivers (vive_node).
#
# The workspace fence stays off until you run `make calibrate`. That writes config/workspace.yaml
# (local to your setup, not tracked by git), which the launch files load after this file.
/**:
  ros__parameters:
    frame_id: vive_world
    filter:
      beta: 0.01
      dcutoff: 1.0
      mincutoff: 1.0
    workspace:
      enabled: false
      # Width of the warning band inside the fence (m): the controller vibrates there but the
      # pose is still published. Outside the fence the pose is held back.
      padding: 0.15
